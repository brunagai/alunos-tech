<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>App do colaborador — Alunos Tech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: "Times New Roman", serif; margin: 1rem; max-width: 28rem; }
    label { display: block; margin-top: 0.6rem; }
    input, select, button { font: inherit; width: 100%; min-height: 2.4rem; }
    p.aviso { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Colaborador</h1>
  <p>Cliente móvel. A matrícula e o chamado usam o aluno do token. Outro aluno é recusado pela API.</p>
  <form id="login">
    <label>E-mail cadastrado <input name="email" type="email" required></label>
    <label>Senha <input name="senha" type="password" value="colaborador-dev" required></label>
    <button>Entrar</button>
  </form>
  <form id="matricula" hidden>
    <h2>Matrícula</h2>
    <label>CursoId <input name="cursoId" required></label>
    <button>Matricular</button>
  </form>
  <form id="chamado" hidden>
    <h2>Chamado</h2>
    <label>Título <input name="titulo" required></label>
    <label>Descrição <input name="descricao"></label>
    <label>Prioridade
      <select name="prioridade"><option value="1">Baixa</option><option value="2" selected>Média</option><option value="3">Alta</option></select>
    </label>
    <button>Abrir chamado</button>
  </form>
  <p class="aviso" id="saida"></p>
  <script>
    let token = "";
    let alunoId = "";
    const saida = document.getElementById("saida");
    async function api(caminho, corpo) {
      const resposta = await fetch(caminho, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: JSON.stringify(corpo)
      });
      const texto = await resposta.text();
      saida.textContent = resposta.status + " " + texto;
      if (!resposta.ok) throw new Error(texto);
      return texto ? JSON.parse(texto) : {};
    }
    document.getElementById("login").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const dados = new FormData(evento.target);
      const resposta = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: dados.get("email"), senha: dados.get("senha") })
      });
      const texto = await resposta.text();
      saida.textContent = resposta.status + " " + texto;
      if (!resposta.ok) return;
      const sessao = JSON.parse(texto);
      token = sessao.token;
      alunoId = sessao.alunoId;
      document.getElementById("matricula").hidden = false;
      document.getElementById("chamado").hidden = false;
    });
    document.getElementById("matricula").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const dados = new FormData(evento.target);
      await api("/api/matriculas", { alunoId, cursoId: dados.get("cursoId") });
    });
    document.getElementById("chamado").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const dados = new FormData(evento.target);
      await api("/api/chamados", {
        alunoId,
        titulo: dados.get("titulo"),
        descricao: dados.get("descricao"),
        prioridade: Number(dados.get("prioridade"))
      });
    });
  </script>
</body>
</html>
